services:
  - type: web
    name: sentinel-ops
    runtime: docker
    plan: free
    healthCheckPath: /api/v1/health
    envVars:
      - key: PORT
        value: 4000
      - key: NODE_ENV
        value: production
      - key: DEMO_ORG_SLUG
        value: northstar
      - key: MONGODB_URI
        sync: false
      - key: DEMO_PASSWORD
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: MFA_ENCRYPTION_KEY
        sync: false
